<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORGE</title>
<style>
:root{--bg:#0b0f14;--p:#131a22;--b:#243241;--t:#e8eef5;--m:#8696a8;--a:#38bdf8;--a2:#fb923c;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(76px + env(safe-area-inset-bottom))}
h2{font-size:26px;margin:18px 0 10px;letter-spacing:-.5px}h3{font-size:16px;margin:18px 0 8px;color:var(--a)}
.c{background:var(--p);border:1px solid var(--b);border-left:3px solid var(--a);border-radius:6px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k{flex:1;min-width:110px;background:var(--p);border:1px solid var(--b);border-radius:6px;padding:10px}
.k b{display:block;font-size:26px;color:var(--a)}.k span,.m{color:var(--m);font-size:13px}
.s{color:var(--a2);font-size:13px;margin:4px 0}
.tag{background:#0f2a3a;color:var(--a);border-radius:3px;padding:1px 6px;font-size:12px}
input,select,textarea{background:#0b1218;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:10px;font:inherit;width:100%;margin:4px 0}
.row input{flex:1;min-width:0;width:auto}
.b{background:var(--a);color:#04121c;border:0;border-radius:6px;padding:10px 14px;font:inherit;font-weight:700;margin:4px 4px 4px 0}
.b.g{background:transparent;color:var(--m);border:1px solid var(--b)}
.chip{display:inline-block;border:1px solid var(--b);border-radius:20px;padding:5px 11px;margin:3px 3px 3px 0;color:var(--m)}.chip.on{background:var(--a);color:#04121c;border-color:var(--a)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e141b;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:10px 0;font:12px inherit}nav button.on{color:var(--a);box-shadow:inset 0 2px var(--a)}
nav i{display:block;font-style:normal;font-size:18px}
#tm{position:fixed;top:env(safe-area-inset-top);right:10px;background:var(--a2);color:#1a0c00;font-weight:700;border-radius:0 0 6px 6px;padding:2px 10px;display:none;z-index:5}
#md{position:fixed;inset:0;background:#000b;display:none;z-index:9;overflow:auto;padding:20px 14px}
#md>div{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px}
pre{white-space:pre-wrap;font:14px/1.5 inherit;margin:0}
label.x{display:block;padding:5px 0}label.x input{width:auto;margin-right:8px}
@keyframes pu{50%{opacity:.35}}.mp{animation:pu 1.6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.mp{animation:none}}.hd{position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:4;margin:0 -14px;padding:0 14px 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px}.chips .chip{white-space:nowrap;margin:0}
.ex{display:flex;align-items:center;gap:12px;background:var(--p);border:1px solid var(--b);border-radius:14px;padding:10px 12px;margin:8px 0}.ex:active{border-color:var(--a)}
.ex .in{flex:1;min-width:0}.pm{color:var(--m);font-size:13px}
input[type=search]{border-radius:22px;padding:11px 16px}</style></head><body>
<div id="tm"></div><div id="v"></div><div id="md"></div>
<nav>
<button data-t="train" onclick="go('train')"><i>▶</i>Entrenar</button>
<button data-t="lib" onclick="go('lib')"><i>☰</i>Ejercicios</button>
<button data-t="prog" onclick="go('prog')"><i>↗</i>Progreso</button>
<button data-t="body" onclick="go('body')"><i>◎</i>Cuerpo</button>
<button data-t="ai" onclick="go('ai')"><i>✦</i>IA</button>
<button data-t="set" onclick="go('set')"><i>⚙</i>Ajustes</button>
</nav>
<script>
const SEED="Press de banca con mancuernas|Pecho|Mancuernas;Flexiones|Pecho|Peso corporal;Flexiones declinadas|Pecho|Peso corporal;Aperturas|Pecho|Mancuernas;Remo con mancuerna|Espalda|Mancuernas;Dominadas|Espalda|Barra;Remo invertido|Espalda|Peso corporal;Pullover|Espalda|Mancuernas;Press militar|Hombros|Mancuernas;Elevaciones laterales|Hombros|Mancuernas;Pájaros|Hombros|Mancuernas;Curl de bíceps|Bíceps|Mancuernas;Curl martillo|Bíceps|Mancuernas;Fondos en silla|Tríceps|Peso corporal;Press francés|Tríceps|Mancuernas;Extensión sobre cabeza|Tríceps|Mancuernas;Sentadilla goblet|Piernas|Mancuernas;Sentadilla búlgara|Piernas|Mancuernas;Zancadas|Piernas|Mancuernas;Peso muerto rumano|Piernas|Mancuernas;Elevación de talones|Piernas|Mancuernas;Hip thrust|Glúteos|Mancuernas;Puente de glúteo|Glúteos|Peso corporal;Plancha|Core|Peso corporal;Crunch|Core|Peso corporal;Elevación de piernas|Core|Peso corporal";
const MG=['Pecho','Espalda','Hombros','Bíceps','Tríceps','Piernas','Glúteos','Core'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.getItem('forge')||'null')||{ex:[],rt:[],lg:[],bd:[],sv:[],st:{}};
S.st={base:'https://api.openai.com/v1',model:'gpt-4o-mini',rest:90,top:12,rem:'18:00',...S.st};
if(!S.ex.length)S.ex=SEED.split(';').map((s,i)=>{const[n,g,e]=s.split('|');return{id:'s'+i,n,g,e}});
const save=()=>localStorage.setItem('forge',JSON.stringify(S)),uid=()=>Math.random().toString(36).slice(2,9);
const E=id=>S.ex.find(x=>x.id==id)||{n:'?',g:'?'},today=()=>new Date().toISOString().slice(0,10);
const SMAP="Press de banca con mancuernas|pecho|hombros,triceps;Flexiones|pecho|hombros,triceps,core;Flexiones declinadas|pecho,hombros|triceps,core;Aperturas|pecho|hombros;Remo con mancuerna|dorsales|trapecio,biceps,antebrazo;Dominadas|dorsales|biceps,antebrazo,trapecio;Remo invertido|dorsales,trapecio|biceps,antebrazo;Pullover|dorsales|pecho,triceps;Press militar|hombros|triceps,trapecio;Elevaciones laterales|hombros|trapecio;Pájaros|hombros,trapecio|dorsales;Curl de bíceps|biceps|antebrazo;Curl martillo|biceps,antebrazo|;Fondos en silla|triceps|hombros,pecho;Press francés|triceps|;Extensión sobre cabeza|triceps|hombros;Sentadilla goblet|cuadriceps,gluteos|aductores,core;Sentadilla búlgara|cuadriceps,gluteos|aductores,isquios;Zancadas|cuadriceps,gluteos|isquios,aductores;Peso muerto rumano|isquios,gluteos|lumbar,antebrazo;Elevación de talones|gemelos|;Hip thrust|gluteos|isquios;Puente de glúteo|gluteos|isquios,core;Plancha|core|hombros,gluteos;Crunch|core|oblicuos;Elevación de piernas|core|oblicuos",SM={},GP={Pecho:['pecho'],Espalda:['dorsales','trapecio'],Hombros:['hombros'],Bíceps:['biceps'],Tríceps:['triceps'],Piernas:['cuadriceps','isquios'],Glúteos:['gluteos'],Core:['core']};
SMAP.split(';').forEach(l=>{const[n,a,b]=l.split('|');SM[n]={p:a.split(','),s:b?b.split(','):[]}});
const MN={pecho:'Pecho',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',antebrazo:'Antebrazo',core:'Abdomen',oblicuos:'Oblicuos',trapecio:'Trapecio',dorsales:'Dorsales',lumbar:'Lumbar',gluteos:'Glúteos',cuadriceps:'Cuádriceps',isquios:'Isquiotibiales',aductores:'Aductores',gemelos:'Gemelos'};
const MS=[['pecho',0,44,48,11,8,1],['hombros',0,27,38,7,8,1],['biceps',0,23,56,5,13,1],['antebrazo',0,19,88,4.5,13,1],['core',0,55,77,7,17,0],['oblicuos',0,40,80,5,14,1],['cuadriceps',0,45,125,9,22,1],['aductores',0,52,128,3,16,1],['gemelos',0,44,172,6,17,1],['trapecio',1,165,44,10,16,0],['hombros',1,137,38,7,8,1],['dorsales',1,152,70,9,16,1],['lumbar',1,165,90,8,8,0],['triceps',1,133,56,5,13,1],['antebrazo',1,129,88,4.5,13,1],['gluteos',1,156,108,10,9,1],['isquios',1,155,138,9,20,1],['gemelos',1,154,174,7,18,1]];
const mus=e=>e.p?{p:e.p,s:e.s||[]}:SM[e.n]||{p:GP[e.g]||[],s:[]};
const un=ids=>{const p=new Set,s=new Set;ids.forEach(i=>{const m=mus(E(i));m.p.forEach(x=>p.add(x));m.s.forEach(x=>s.add(x))});return{p:[...p],s:[...s].filter(x=>!p.has(x))}};
const mt=m=>'<span style="color:#ef4444">Principal:</span> '+m.p.map(x=>MN[x]).join(', ')+(m.s.length?'<br><span style="color:var(--a)">Secundario:</span> '+m.s.map(x=>MN[x]).join(', '):'');
function fig(m,w){let h='';const el=(x,y,a,b,f,c='')=>h+=`<ellipse class="${c}" cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${f}"/>`;
[55,165].forEach(c=>{h+=`<circle cx="${c}" cy="16" r="10" fill="#1b2733"/><path d="M${c-25} 34Q${c} 27 ${c+25} 34L${c+19} 100L${c-19} 100Z" fill="#1b2733"/>`;[[31,54,7,19],[35,88,6,17],[10,128,12,27],[11,172,8,21]].forEach(([d,y,a,b])=>{el(c-d,y,a,b,'#1b2733');el(c+d,y,a,b,'#1b2733')})});
MS.forEach(([n,v,x,y,a,b,mr])=>{const k=m.p.includes(n)?1:m.s.includes(n)?2:0,f=k==1?'#ef4444':k==2?'#38bdf8':'#2a3a49',c=55+110*v;el(x,y,a,b,f,k==1?'mp':'');if(mr)el(2*c-x,y,a,b,f,k==1?'mp':'')});
return`<svg viewBox="0 0 220 195" width="${w}" style="flex:none">${h}</svg>`}
const vol=l=>l.sets.reduce((a,s)=>a+s.kg*s.r,0),e1=l=>Math.max(...l.sets.map(s=>s.kg*(1+s.r/30)));
const lastOf=id=>S.lg.filter(l=>l.ex==id).sort((a,b)=>a.d<b.d?1:-1)[0];
let T='train',cur=null,flt='Todos',sel='',bm='peso';
function chart(v,lab){if(v.length<2)return'<p class=m>'+lab+': mínimo 2 sesiones para graficar.</p>';
const w=320,h=120,mx=Math.max(...v),mn=Math.min(...v),rg=(mx-mn)||1,P=v.map((y,i)=>[10+i*(w-20)/(v.length-1),h-14-(y-mn)/rg*(h-34)]);
return`<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="#38bdf8" stroke-width="2" points="${P.map(p=>p.join(',')).join(' ')}"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#38bdf8"/>`).join('')}<text x="10" y="12" fill="#8696a8" font-size="11">${lab}: ${mn.toFixed(1)} → ${mx.toFixed(1)}</text></svg>`}
function sug(id){const l=lastOf(id);if(!l)return'Sin historial: fija tu línea base';const mx=Math.max(...l.sets.map(s=>s.kg));
return l.sets.every(s=>s.r>=S.st.top)?(mx?`Sube a ${mx+2.5} kg: completaste ${S.st.top}+ reps en todas las series`:'Todas las series al tope: añade lastre o variante más difícil'):`Mantén ${mx} kg y busca +1 rep por serie hasta ${S.st.top}`}
function vTrain(){if(cur)return vSes();const w=new Date(Date.now()-7*864e5).toISOString().slice(0,10),wk=S.lg.filter(l=>l.d>=w);
return`<h2>Hoy</h2><div class=row><div class=k><b>${new Set(wk.map(l=>l.d)).size}</b><span>días activos (7d)</span></div><div class=k><b>${Math.round(wk.reduce((a,l)=>a+vol(l),0))}</b><span>kg de volumen (7d)</span></div></div>
<h3>Rutinas</h3>${S.rt.map(r=>`<div class=c><div style="float:right">${fig(un(r.ex),104)}</div><b>${esc(r.n)}</b><div class=m>${r.ex.map(i=>esc(E(i).n)).join(', ')}</div><div style="clear:both"></div><button class=b onclick="start('${r.id}')">Iniciar</button><button class="b g" onclick="delR('${r.id}')">Borrar</button></div>`).join('')||'<p class=m>Aún no hay rutinas. Crea la primera.</p>'}<button class=b onclick="newR()">Crear rutina</button>`}
function vSes(){return`<h2>${esc(cur.n)}</h2>`+cur.it.map((x,i)=>{const e=E(x.ex),l=lastOf(x.ex),z=x.sets.at(-1);
return`<div class=c><div style="float:right" onclick="det('${x.ex}')">${fig(mus(e),104)}</div><b>${esc(e.n)}</b> <span class=tag>${e.g}</span><div class=m>${mt(mus(e))}</div><div class=m>Última: ${l?l.sets.map(s=>s.kg+'×'+s.r).join('  ')+' ('+l.d+')':'—'}</div><div class=s>${sug(x.ex)}</div>${x.sets.map((s,j)=>`<div class=m>Serie ${j+1}: ${s.kg} kg × ${s.r}</div>`).join('')}<div class=row style="clear:both"><input id=kg${i} type=number inputmode=decimal placeholder="kg (0 = corporal)" value="${z?z.kg:''}"><input id=r${i} type=number inputmode=numeric placeholder=reps value="${z?z.r:''}"><button class=b onclick="addS(${i})">+ Serie</button></div></div>`}).join('')+`<button class=b onclick="fin()">Guardar sesión</button><button class="b g" onclick="cur=null;R()">Cancelar</button>`}
function vLib(){return`<div class=hd><div class=row style="justify-content:space-between;flex-wrap:nowrap"><h2 style="margin:12px 0 8px">Ejercicios</h2><button class=b onclick="newEx()">+ Nuevo</button></div><input id=q type=search placeholder="Buscar ejercicio, músculo o equipo" value="${esc(q)}" oninput="q=this.value;$('#ls').innerHTML=lstH()"><div class=chips>${['Todos',...MG].map(g=>`<span class="chip ${g==flt?'on':''}" onclick="chipX=this.parentNode.scrollLeft;flt='${g}';R()">${g}</span>`).join('')}</div></div><div id=ls>${lstH()}</div>`}
function vProg(){const ids=[...new Set(S.lg.map(l=>l.ex))];if(!sel||!ids.includes(sel))sel=ids[0]||'';
const L=S.lg.filter(l=>l.ex==sel).sort((a,b)=>a.d<b.d?-1:1),w=new Date(Date.now()-7*864e5).toISOString().slice(0,10),g={};
S.lg.filter(l=>l.d>=w).forEach(l=>g[E(l.ex).g]=(g[E(l.ex).g]||0)+l.sets.length);
return`<h2>Progreso</h2>${ids.length?`<select onchange="sel=this.value;R()">${ids.map(i=>`<option value="${i}" ${i==sel?'selected':''}>${esc(E(i).n)}</option>`).join('')}</select><div class=c>${chart(L.map(e1),'1RM estimado (kg)')}</div><div class=c>${chart(L.map(vol),'Volumen por sesión (kg)')}</div>`:'<p class=m>Registra una sesión para ver métricas.</p>'}
<h3>Series por grupo muscular (7d)</h3>${MG.map(m=>`<div class=row><span style="width:80px">${m}</span><div style="height:8px;background:var(--a);width:${(g[m]||0)*12}px;border-radius:2px"></div><span class=m>${g[m]||0}</span></div>`).join('')}
<h3>Strava</h3>${S.sv.slice(0,10).map(a=>`<div class=c><b>${esc(a.n)}</b> <span class=tag>${esc(a.t)}</span><div class=m>${a.d} · ${a.km.toFixed(1)} km · ${Math.round(a.min)} min${a.hr?' · '+Math.round(a.hr)+' lpm':''}</div></div>`).join('')||'<p class=m>Sin datos. Configura Strava en Ajustes.</p>'}`}
const BF=[['peso','Peso (kg)'],['grasa','Grasa (%)'],['cintura','Cintura (cm)'],['cadera','Cadera (cm)'],['pecho','Pecho (cm)'],['brazo','Brazo (cm)'],['muslo','Muslo (cm)']];
function vBody(){const h=S.bd.filter(b=>b[bm]!=null).sort((a,b)=>a.d<b.d?-1:1);
return`<h2>Cuerpo</h2><div class=c>${BF.map(([k,l])=>`<input id=b_${k} type=number inputmode=decimal placeholder="${l}">`).join('')}<button class=b onclick="saveB()">Guardar medidas</button></div><h3>Tendencia</h3>${BF.map(([k,l])=>`<span class="chip ${k==bm?'on':''}" onclick="bm='${k}';R()">${l.split(' ')[0]}</span>`).join('')}<div class=c>${chart(h.map(b=>b[bm]),bm)}</div>${S.bd.slice(-5).reverse().map(b=>`<div class=m>${b.d}: ${BF.filter(([k])=>b[k]!=null).map(([k])=>k+' '+b[k]).join(' · ')}</div>`).join('')}`}
function vAi(){return`<h2>IA</h2><div class=c><b>Análisis físico</b><div class=m>Foto frontal con buena luz. Se envía solo al proveedor que configuraste.</div><input id=ph type=file accept="image/*" capture=environment onchange="photo(this.files[0])"></div>
<div class=c><b>Coach de sobrecarga</b><div class=m>Evalúa tus últimos 30 días y propone ajustes de carga.</div><button class=b onclick="coach()">Analizar historial</button></div>
<div class=c><b>Rutina con IA</b><input id=goal placeholder="Objetivo y equipo (ej: hipertrofia, 4 días, mancuernas)"><button class=b onclick="genR()">Generar rutina</button></div><div class=c id=out style="display:none"><pre id=ot></pre></div>`}
function vSet(){const f=(k,l,t='text')=>`<div class=m>${l}</div><input type=${t} value="${esc(S.st[k]??'')}" onchange="S.st.${k}=this.type=='number'?+this.value:this.value;save()">`;
return`<h2>Ajustes</h2><h3>IA (compatible OpenAI)</h3>${f('base','URL base')}${f('model','Modelo (con visión para fotos)')}${f('key','API key','password')}<h3>Strava</h3><div class=m>Crea tu app en strava.com/settings/api. Necesitas Client ID, Secret y un refresh token con scope activity:read.</div>${f('sid','Client ID')}${f('ssec','Client Secret','password')}${f('sref','Refresh token','password')}<button class=b onclick="sync()">Sincronizar Strava</button><h3>Entrenamiento</h3>${f('rest','Descanso (s)','number')}${f('top','Tope de reps para subir carga','number')}${f('rem','Recordatorio diario','time')}<button class=b onclick="remind()">Activar recordatorio</button><h3>Datos</h3><button class="b g" onclick="navigator.clipboard.writeText(JSON.stringify(S));alert('Copiado al portapapeles')">Exportar</button><button class="b g" onclick="imp()">Importar</button>`}
function R(){$('#v').innerHTML={train:vTrain,lib:vLib,prog:vProg,body:vBody,ai:vAi,set:vSet}[T]();const cc=$('.chips');if(cc)cc.scrollLeft=chipX;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T))}
const go=t=>{T=t;R();scrollTo(0,0)};
function modal(h){$('#md').innerHTML='<div>'+h+'</div>';$('#md').style.display='block'}const closeM=()=>$('#md').style.display='none';
function newR(){modal(`<input id=rn placeholder="Nombre de la rutina">${MG.map(g=>`<h3>${g}</h3>${S.ex.filter(e=>e.g==g).map(e=>`<label class=x><input type=checkbox value="${e.id}">${esc(e.n)}</label>`).join('')}`).join('')}<button class=b onclick="saveR()">Guardar</button><button class="b g" onclick="closeM()">Cerrar</button>`)}
function saveR(){const ex=[...document.querySelectorAll('#md input:checked')].map(i=>i.value),n=$('#rn').value.trim();if(!n||!ex.length)return alert('Nombre y al menos un ejercicio');S.rt.push({id:uid(),n,ex});save();closeM();R()}
function delR(id){if(confirm('¿Borrar rutina?')){S.rt=S.rt.filter(r=>r.id!=id);save();R()}}
function start(id){const r=S.rt.find(x=>x.id==id);cur={n:r.n,it:r.ex.map(ex=>({ex,sets:[]}))};R()}
function addS(i){const kg=+$('#kg'+i).value||0,r=+$('#r'+i).value;if(!r)return alert('Indica las reps');cur.it[i].sets.push({kg,r});R();rest(S.st.rest)}
function fin(){const d=today();cur.it.filter(x=>x.sets.length).forEach(x=>S.lg.push({id:uid(),d,ex:x.ex,sets:x.sets}));save();cur=null;R()}
function saveB(){const o={d:today()};BF.forEach(([k])=>{const v=$('#b_'+k).value;if(v)o[k]=+v});if(Object.keys(o).length<2)return;S.bd.push(o);save();R()}
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;let tmr;
async function rest(s){clearInterval(tmr);let t=s;const el=$('#tm');el.style.display='block';const tick=()=>{el.textContent='Descanso '+t+'s';if(t--<=0){clearInterval(tmr);el.style.display='none';navigator.vibrate&&navigator.vibrate([300,100,300])}};tick();tmr=setInterval(tick,1000);
try{const n=LN();if(n){await n.requestPermissions();await n.schedule({notifications:[{id:999,title:'Descanso terminado',body:'Siguiente serie',schedule:{at:new Date(Date.now()+s*1000),allowWhileIdle:true}}]})}}catch(e){}}
async function remind(){const n=LN();if(!n)return alert('Solo disponible en la app instalada');const[h,m]=S.st.rem.split(':').map(Number);try{await n.requestPermissions();await n.schedule({notifications:[{id:1,title:'FORGE',body:'Hora de entrenar',schedule:{on:{hour:h,minute:m},repeats:true,allowWhileIdle:true}}]});alert('Recordatorio diario a las '+S.st.rem)}catch(e){alert(e.message)}}

return j.choices[0].message.content||''}

let q='',chipX=0;const nz=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const DS={};`Press de banca con mancuernas|Acostado en banco o suelo, mancuernas a la altura del pecho con codos a unos 45°. Empuja hasta extender los brazos sin bloquear los codos y baja controlado en 2 o 3 segundos.
Flexiones|Manos un poco más anchas que los hombros y cuerpo en línea recta de cabeza a talones. Baja hasta casi rozar el suelo con codos a 45° y empuja sin hundir la cadera.
Flexiones declinadas|Pies elevados sobre una silla o banco y manos en el suelo. Baja el pecho de forma controlada y empuja; la elevación carga más el pecho superior y los hombros.
Aperturas|Acostado con mancuernas sobre el pecho y codos ligeramente flexionados. Abre los brazos en arco hasta sentir estiramiento en el pecho y vuelve como si abrazaras un árbol.
Remo con mancuerna|Apoya mano y rodilla en un banco con espalda neutra. Tira de la mancuerna hacia la cadera llevando el codo atrás, aprieta la espalda arriba y baja con control.
Dominadas|Agarre algo más ancho que los hombros, cuelga con los hombros activos. Tira hasta pasar la barbilla de la barra llevando los codos hacia las costillas y baja controlado.
Remo invertido|Bajo una mesa firme o barra baja, cuerpo recto y talones apoyados. Tira del pecho hacia el borde juntando las escápulas y baja sin perder tensión.
Pullover|Acostado, sostén una mancuerna con ambas manos sobre el pecho. Llévala detrás de la cabeza con codos semiflexionados hasta sentir estiramiento y regresa usando el dorsal.
Press militar|De pie o sentado, mancuernas a la altura de los hombros. Empuja hacia arriba hasta casi extender los codos, con abdomen firme y sin arquear la zona lumbar, y baja controlado.
Elevaciones laterales|De pie con mancuernas a los costados y codos levemente flexionados. Eleva los brazos hasta la altura de los hombros sin balancear el torso y baja lento.
Pájaros|Torso inclinado al frente con espalda recta. Abre los brazos hacia los lados con codos ligeros hasta la altura de los hombros, juntando las escápulas, y baja controlado.
Curl de bíceps|De pie con codos pegados al torso. Flexiona los codos subiendo las mancuernas sin balancear el cuerpo, aprieta arriba y baja en 2 o 3 segundos.
Curl martillo|Como el curl normal pero con agarre neutro, palmas enfrentadas. Sube sin mover los codos; trabaja también el braquial y el antebrazo.
Fondos en silla|Manos en el borde de una silla firme, piernas extendidas o flexionadas. Baja doblando los codos hacia atrás hasta unos 90° y empuja con los tríceps sin dejar caer los hombros.
Press francés|Acostado con las mancuernas sobre el pecho y brazos verticales. Flexiona solo los codos llevando el peso hacia la frente y extiende sin abrir los codos.
Extensión sobre cabeza|De pie o sentado con una mancuerna sostenida con ambas manos detrás de la cabeza. Extiende los codos hacia arriba con los brazos pegados a las orejas y baja controlado.
Sentadilla goblet|Sostén una mancuerna contra el pecho, pies al ancho de hombros. Baja con el pecho alto y las rodillas siguiendo la línea de los pies hasta paralelo o más, y sube empujando el suelo.
Sentadilla búlgara|Pie trasero apoyado en un banco o silla. Baja con la rodilla delantera alineada con el pie hasta casi tocar el suelo con la trasera y sube empujando con el talón delantero.
Zancadas|Da un paso largo al frente y baja hasta que ambas rodillas formen cerca de 90°. Empuja con el pie delantero para volver, con el torso erguido.
Peso muerto rumano|Mancuernas frente a los muslos y rodillas semiflexionadas. Lleva la cadera atrás deslizando las pesas por las piernas con espalda neutra hasta sentir tensión en los isquios y sube apretando glúteos.
Elevación de talones|De pie con mancuernas, sube sobre las puntas lo máximo posible, pausa un segundo arriba y baja lento. Apoya la punta en un escalón para más recorrido.
Hip thrust|Espalda alta apoyada en un banco y mancuerna sobre la cadera. Empuja con los talones hasta alinear rodillas, cadera y hombros, aprieta glúteos un segundo y baja controlado.
Puente de glúteo|Acostado boca arriba con rodillas flexionadas. Eleva la cadera apretando glúteos hasta formar línea de hombros a rodillas y baja sin apoyar del todo.
Plancha|Antebrazos y puntas de los pies apoyados, cuerpo en línea recta. Contrae abdomen y glúteos, no dejes caer la cadera y respira de forma constante durante todo el tiempo.
Crunch|Acostado con rodillas flexionadas y manos a los lados de la cabeza. Eleva solo los hombros contrayendo el abdomen, sin tirar del cuello, y baja lento.
Elevación de piernas|Acostado con la zona lumbar pegada al suelo. Sube las piernas casi rectas hasta 90° y baja sin tocar el suelo, evitando que la espalda se arquee.`.split('\n').forEach(l=>{const i=l.indexOf('|');DS[l.slice(0,i)]=l.slice(i+1)});
const desc=e=>{const d=e.d||DS[e.n];return d?esc(d).replace(/\n/g,'<br>'):`<span class=m>Sin descripción.</span> <button class="b g" onclick="regen('${e.id}')">Generar con IA</button>`};
